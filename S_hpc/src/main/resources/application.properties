vaadin.launch-browser=true
spring.application.name=S_hpc
server.port=8091
#spring.datasource.url=jdbc:h2:mem:testdb
spring.h2.console.enabled=true
spring.main.allow-circular-references=true


# Configuration Ollama
langchain4j.ollama.chat-model.base-url=http://localhost:11434
langchain4j.ollama.chat-model.model-name=llama3.2:3b
langchain4j.ollama.chat-model.temperature=0.7
langchain4j.ollama.chat-model.timeout=180s

# Configuration streaming
langchain4j.ollama.streaming-chat-model.base-url=http://localhost:11434
langchain4j.ollama.streaming-chat-model.model-name=llama3.2:3b
langchain4j.ollama.streaming-chat-model.temperature=0.7
langchain4j.ollama.streaming-chat-model.timeout=180s

# Logs pour debug
logging.level.dev.langchain4j=DEBUG
logging.level.okhttp3=DEBUG

# Configuration PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/hpc_db
spring.datasource.username=postgres
spring.datasource.password=9195
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
