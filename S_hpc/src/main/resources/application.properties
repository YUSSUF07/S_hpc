# ========================================
# APPLICATION
# ========================================
spring.application.name=S_hpc
server.port=8091
spring.main.allow-circular-references=true

# ========================================
# BASE DE DONNÉES - PostgreSQL
# ========================================
spring.datasource.url=jdbc:postgresql://localhost:5432/hpc_db
spring.datasource.username=postgres
spring.datasource.password=9195
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Console H2 désactivée
spring.h2.console.enabled=false

# ========================================
# LANGCHAIN4J - OLLAMA
# ========================================
langchain4j.ollama.chat-model.base-url=http://localhost:11434
langchain4j.ollama.chat-model.model-name=llama3.2:3b
langchain4j.ollama.chat-model.temperature=0.7
langchain4j.ollama.chat-model.timeout=180s

# ========================================
# ASSEMBLYAI
# ========================================
assemblyai.api.key=e5e6718f6cf64c5ea568f89b60b8af02

# ========================================
# VAADIN (OPTIMISÉ + FIX WMI)
# ========================================
vaadin.launch-browser=true
vaadin.allowed-packages=YF.S_hpc

# DÉSACTIVE DevTools pour éviter le bug WMI Windows
vaadin.devmode.enable-hotswap=false
vaadin.devmode.liveReload.enabled=false

# Alternative : mode production (ultra rapide)
# vaadin.productionMode=true

# ========================================
# SPRING DEVTOOLS (DÉSACTIVÉ)
# ========================================
spring.devtools.restart.enabled=false

# ========================================
# LOGS (RÉDUITS)
# ========================================
logging.level.root=INFO
logging.level.YF.S_hpc=DEBUG
logging.level.org.atmosphere=WARN
logging.level.com.vaadin=INFO
logging.level.org.apache.catalina=WARN
logging.level.org.springframework=INFO
logging.level.okhttp3=WARN
logging.level.org.hibernate=WARN
logging.level.com.zaxxer.hikari=WARN
logging.level.com.github.oshi=ERROR